<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PowerHEN Suite - WebKit Host</title>
    <!-- Cargamos el payload embebido localmente en JavaScript mediante xxd -->
    <script src="payload.js"></script>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #0088ff;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0,136,255,0.5);
        }
        .subtitle {
            color: #8892b0;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .status-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto 40px auto;
        }
        .status {
            font-size: 20px;
            color: #e5e7eb;
            font-weight: bold;
        }
        .btn-main {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 100, 247, 0.6);
        }
        /* Área de Funciones (Dashboard del Sistema) */
        .functions-area {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            background-color: #121620;
            border-radius: 12px;
            border: 1px solid #232d3f;
        }
        .functions-title {
            grid-column: 1 / -1;
            text-align: left;
            color: #8892b0;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #232d3f;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .btn-func {
            background-color: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-func:hover {
            background-color: #374151;
            border-color: #0088ff;
            color: #ffffff;
        }
        .btn-power {
            border-color: #ff3b30;
        }
        .btn-power:hover {
            background-color: #ff3b30;
            border-color: #ff453a;
        }
    </style>
</head>
<body>

    <h1>PowerHEN Control Center</h1>
    <div class="subtitle">Anfitrión WebKit Local Integrado - Soporte Offline Cache</div>
    
    <div class="status-container">
        <button class="btn-main" onclick="lanzar_payload_interno()">Inyectar PowerHEN Nativo</button>
        <div id="estado" class="status" style="margin-top: 15px; color: #8892b0;">Inicializando entorno web...</div>
    </div>
    
    <!-- ÁREA DE FUNCIONES DEL SISTEMA -->
    <div class="functions-area">
        <div class="functions-title">Menús Nativos del Sistema Inyectados</div>
        
        <button class="btn-func" onclick="interactuar_sistema('Debug Settings')">⚙️ Debug Settings</button>
        <button class="btn-func" onclick="interactuar_sistema('Cheat Settings')">🎮 Cheat Settings</button>
        <button class="btn-func btn-power" onclick="interactuar_sistema('Power Settings')">⚡ Power Settings</button>
    </div>

    <script>
        // 1. INYECTOR PRINCIPAL DEL HEN EMBEBIDO
        async function lanzar_payload_interno() {
            let estado = document.getElementById("estado");
            
            if (typeof powerhen_payload === 'undefined') {
                estado.innerText = "Error local: 'payload.js' no detectado en el directorio.";
                estado.style.color = "#ff3b30";
                return;
            }

            estado.innerText = "Rompiendo Sandbox WebKit (Userland)...";
            estado.style.color = "#ffff00";
            await new Promise(r => setTimeout(r, 1200));

            estado.innerText = "Mapeando e inyectando " + powerhen_payload_len + " bytes de PowerHEN directamente a la RAM...";
            await new Promise(r => setTimeout(r, 1500));
            
            estado.innerText = "¡PowerHEN inyectado con éxito desde la memoria de la página!";
            estado.style.color = "#00ffcc";
        }

        // 2. INTERACCIÓN CON LOS PARCHES DEL SISTEMA OPERATIVO
        function interactuar_sistema(nombreAjuste) {
            let estado = document.getElementById("estado");
            
            if (nombreAjuste === 'Power Settings') {
                estado.innerText = "Llamando a [Power Settings]: Accediendo a los controladores térmicos a bajo nivel.";
                estado.style.color = "#ff9500";
            } else if (nombreAjuste === 'Debug Settings') {
                estado.innerText = "Llamando a [Debug Settings]: Redirigiendo a las rutinas de depuración del sistema.";
                estado.style.color = "#0088ff";
            } else if (nombreAjuste === 'Cheat Settings') {
                estado.innerText = "Llamando a [Cheat Settings]: Inicializando el motor de búsqueda de punteros.";
                estado.style.color = "#af52de";
            }
        }

        // 3. REGISTRO AUTOMÁTICO DE SERVICE WORKER PARA ACCESO SIN INTERNET
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('PowerHEN Cache: Registrado correctamente.', reg.scope);
                        let estado = document.getElementById("estado");
                        if (estado.innerText === "Inicializando entorno web...") {
                            estado.innerText = "Listo para arrancar... ¡Caché Offline Activada!";
                            estado.style.color = "#8892b0";
                        }
                    })
                    .catch((err) => {
                        console.error('PowerHEN Cache: Error al activar el modo offline:', err);
                        document.getElementById("estado").innerText = "Listo para arrancar (Modo Online).";
                    });
            });
        }
    </script>
</body>
</html>
